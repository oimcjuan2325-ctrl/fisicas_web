<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GeoSmart IA - Geometría Interactiva</title>
    <link rel="stylesheet" type="text/css" href="https://jsxgraph.org/distrib/jsxgraph.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-panel">
            <h1>GeoSmart IA</h1>
            <div id="jxgbox" class="jxgbox" style="width:600px; height:600px;"></div>
        </div>
        <div id="right-panel">
            <h2>Tutor Matemático</h2>
            <div id="chat-box">
                <p class="ia-msg">¡Hola! Mueve los puntos en el plano y pregúntame sobre la geometría de la figura.</p>
            </div>
            <input type="text" id="user-input" placeholder="Pregunta algo sobre el triángulo...">
        </div>
    </div>

    <script type="text/javascript" src="https://jsxgraph.org/distrib/jsxgraphcore.js"></script>
    <script src="script.js"></script>
</body>
</html>
