<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GeoSmart IA - Arquitecto Geométrico</title>
    <!-- Librería oficial de GeoGebra -->
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <!-- Enlazamos nuestro archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ggb-container"></div>
    
    <div id="chat-panel">
        <h2>GeoSmart IA</h2>
        <div id="chat-box">
            <p>Hola. Pídeme que dibuje algo. Ej: "Dibuja una parábola f(x)=x²" o "Dibuja un círculo de radio 5".</p>
        </div>
        <input type="text" id="userInput" placeholder="Escribe tu comando matemático...">
    </div>

    <!-- Enlazamos nuestro archivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
